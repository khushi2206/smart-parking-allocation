<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview • RouteWise</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app-root"></div>

  <!-- Page Template Content -->
  <template id="page-content">
    <!-- Summary Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <span>Warehouses</span>
          <div class="stat-icon" style="background:#eff6ff; color:#2563eb;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
          </div>
        </div>
        <div class="stat-value" id="stat-warehouses">0</div>
        <div class="stat-desc">Supply hubs</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Locations</span>
          <div class="stat-icon" style="background:#f1f5f9; color:#0f172a;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            </svg>
          </div>
        </div>
        <div class="stat-value" id="stat-locations">0</div>
        <div class="stat-desc">Network nodes (V)</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Roads</span>
          <div class="stat-icon" style="background:#f1f5f9; color:#475569;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
            </svg>
          </div>
        </div>
        <div class="stat-value" id="stat-roads">0</div>
        <div class="stat-desc">Weighted edges (E)</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Pending Orders</span>
          <div class="stat-icon" style="background:#fffbeb; color:#d97706;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
        </div>
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-desc">Awaiting routing</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Delivered</span>
          <div class="stat-icon" style="background:#f0fdf4; color:#16a34a;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
        </div>
        <div class="stat-value" id="stat-delivered">0</div>
        <div class="stat-desc">Completed orders</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Unreachable</span>
          <div class="stat-icon" style="background:#fef2f2; color:#dc2626;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
          </div>
        </div>
        <div class="stat-value" id="stat-unreachable">0</div>
        <div class="stat-desc">Disconnected nodes</div>
      </div>
    </div>

    <!-- Quick Actions Bar -->
    <div class="panel" style="background: linear-gradient(to right, #ffffff, #f8fafc);">
      <div class="panel-body" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;">
        <div>
          <div style="font-weight:700; font-size:1.05rem; color:#0f172a;">Quick Actions</div>
          <div style="font-size:0.8rem; color:#64748b;">Build your network graph or run multi-warehouse optimization</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <a href="/locations.html" class="btn btn-secondary btn-sm">+ Add Location</a>
          <a href="/warehouses.html" class="btn btn-secondary btn-sm">+ Add Warehouse</a>
          <a href="/roads.html" class="btn btn-secondary btn-sm">+ Add Road</a>
          <a href="/orders.html" class="btn btn-secondary btn-sm">+ Add Order</a>
          <a href="/optimizer.html" class="btn btn-primary btn-sm">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <span>Optimize Delivery Routes</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Empty State Guide (Shown only when 0 locations) -->
    <div class="panel" id="overview-empty-panel" style="display:none;">
      <div class="empty-state">
        <div class="empty-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
          </svg>
        </div>
        <div class="empty-title">Welcome to RouteWise</div>
        <div class="empty-text">
          No graph data has been added yet. Start by creating locations (vertices) and warehouses to build your custom delivery network.
        </div>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <a href="/locations.html" class="btn btn-primary">Start by Adding Locations</a>
        </div>
      </div>
    </div>

    <!-- Active Dashboard: Road Network Preview & Recent Activity -->
    <div id="overview-active-content" style="display:none; display:flex; flex-direction:column; gap:20px;">
      <!-- Grid: Graph Preview & Warehouses -->
      <div style="display:grid; grid-template-columns: 1.6fr 1fr; gap:20px;">
        <!-- Graph Preview Card -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title-box">
              <span class="panel-title">Road Network Graph Preview</span>
            </div>
            <a href="/roads.html" class="btn btn-secondary btn-sm">Full Screen & Add Roads →</a>
          </div>
          <div class="panel-body" style="padding:0;">
            <div class="graph-container" id="overview-graph-container" style="height:360px; border:none; border-radius:0;"></div>
          </div>
        </div>

        <!-- Warehouses List Card -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title-box">
              <span class="panel-title">Active Warehouses</span>
            </div>
            <a href="/warehouses.html" class="btn btn-secondary btn-sm">+ Manage</a>
          </div>
          <div class="panel-body" style="padding:0;">
            <div class="table-container" style="border:none; border-radius:0;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Hub Name</th>
                    <th>Location Node</th>
                    <th>Capacity</th>
                  </tr>
                </thead>
                <tbody id="overview-warehouses-body">
                  <tr><td colspan="3" style="text-align:center; color:#94a3b8;">No warehouses registered yet.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent Delivery Orders Table -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title-box">
            <span class="panel-title">Recent Delivery Orders</span>
          </div>
          <div style="display:flex; gap:8px;">
            <a href="/orders.html" class="btn btn-secondary btn-sm">View All Orders →</a>
            <a href="/orders.html" class="btn btn-primary btn-sm">+ New Order</a>
          </div>
        </div>
        <div class="panel-body" style="padding:0;">
          <div class="table-container" style="border:none; border-radius:0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Destination Location</th>
                  <th>Assigned Hub</th>
                  <th>Priority</th>
                  <th>Package Wt.</th>
                  <th>Service Time</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="overview-orders-body">
                <tr><td colspan="7" style="text-align:center; color:#94a3b8; padding:24px;">No delivery orders yet.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="/overview.js"></script>
</body>
</html>
