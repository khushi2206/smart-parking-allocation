<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Structures Explorer • RouteWise</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app-root"></div>

  <template id="page-content">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title-box">
          <span class="panel-title">DAA Data Structures Explorer</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn btn-secondary btn-sm" id="btn-toggle-raw-view">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
            </svg>
            <span id="raw-view-text">Switch to Raw JSON</span>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs-header" id="ds-tabs-header">
        <button class="tab-btn active" data-tab="tab-graph">1. Adjacency List (Graph)</button>
        <button class="tab-btn" data-tab="tab-heap">2. Binary Min-Heap (PQ)</button>
        <button class="tab-btn" data-tab="tab-distances">3. Distance & Predecessor Maps</button>
        <button class="tab-btn" data-tab="tab-visited">4. Visited Set</button>
        <button class="tab-btn" data-tab="tab-warehouses">5. Warehouse Collection</button>
        <button class="tab-btn" data-tab="tab-orders">6. Order Priority List</button>
        <button class="tab-btn" data-tab="tab-sequence">7. Final Route Sequence</button>
      </div>

      <!-- Tab 1: Weighted Graph Adjacency List -->
      <div class="tab-content active" id="tab-graph">
        <div style="margin-bottom:16px;">
          <h3 style="font-size:1.05rem; font-weight:700; color:#0f172a;">Adjacency List: Map&lt;Location, Edge[]&gt;</h3>
          <p style="font-size:0.84rem; color:#475569;">
            The graph is represented using an adjacency map where each key is a vertex $u \in V$ and the value is a dynamic array of outgoing weighted road edges $(u \to v)$ with independent weights: distance (km), travel time (min), and monetary cost (₹).
          </p>
        </div>
        <div id="graph-human-view" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px;"></div>
        <pre class="code-viewer" id="graph-raw-view" style="display:none;"></pre>
      </div>

      <!-- Tab 2: Binary Min-Heap (Priority Queue) -->
      <div class="tab-content" id="tab-heap">
        <div style="margin-bottom:16px;">
          <h3 style="font-size:1.05rem; font-weight:700; color:#0f172a;">Custom Binary Min-Heap (MinPriorityQueue)</h3>
          <p style="font-size:0.84rem; color:#475569;">
            Implemented completely in vanilla JavaScript without any external heap library. Backed by a 1D array where for any node at index $i$, the parent is at $\lfloor (i-1)/2 \rfloor$ and children are at $2i + 1$ and $2i + 2$.
          </p>
        </div>
        <div id="heap-human-view"></div>
        <pre class="code-viewer" id="heap-raw-view" style="display:none;"></pre>
      </div>

      <!-- Tab 3: Distance Table & Predecessor Map -->
      <div class="tab-content" id="tab-distances">
        <div style="margin-bottom:16px;">
          <h3 style="font-size:1.05rem; font-weight:700; color:#0f172a;">Distance Table & Predecessor Map (Shortest Path Trees)</h3>
          <p style="font-size:0.84rem; color:#475569;">
            Populated by the most recent Dijkstra algorithm run. The distance table maintains the optimal relaxed score from the source to each vertex. The predecessor map records the immediate predecessor used to reconstruct the exact shortest path.
          </p>
        </div>
        <div id="distances-human-view"></div>
        <pre class="code-viewer" id="distances-raw-view" style="display:none;"></pre>
      </div>

      <!-- Tab 4: Visited Set -->
      <div class="tab-content" id="tab-visited">
        <div style="margin-bottom:16px;">
          <h3 style="font-size:1.05rem; font-weight:700; color:#0f172a;">Visited / Explored Vertices Set</h3>
          <p style="font-size:0.84rem; color:#475569;">
            Tracks vertices extracted from the priority queue whose shortest distances are finalized. Guarantees each vertex is explored at most once.
          </p>
        </div>
        <div id="visited-human-view"></div>
        <pre class="code-viewer" id="visited-raw-view" style="display:none;"></pre>
      </div>

      <!-- Tab 5: Warehouse Collection -->
      <div class="tab-content" id="tab-warehouses">
        <div style="margin-bottom:16px;">
          <h3 style="font-size:1.05rem; font-weight:700; color:#0f172a;">Warehouse Entity Collection</h3>
          <p style="font-size:0.84rem; color:#475569;">
            Active supply depots containing geographic node mappings, weight capacity constraints, and default hub designations.
          </p>
        </div>
        <div id="wh-human-view"></div>
        <pre class="code-viewer" id="wh-raw-view" style="display:none;"></pre>
      </div>

      <!-- Tab 6: Order Priority List -->
      <div class="tab-content" id="tab-orders">
        <div style="margin-bottom:16px;">
          <h3 style="font-size:1.05rem; font-weight:700; color:#0f172a;">Delivery Orders Priority List</h3>
          <p style="font-size:0.84rem; color:#475569;">
            Priority ordering: Critical &gt; High &gt; Normal &gt; Low. Used by the greedy multi-warehouse heuristic to schedule delivery stops.
          </p>
        </div>
        <div id="orders-human-view"></div>
        <pre class="code-viewer" id="orders-raw-view" style="display:none;"></pre>
      </div>

      <!-- Tab 7: Final Delivery Sequence -->
      <div class="tab-content" id="tab-sequence">
        <div style="margin-bottom:16px;">
          <h3 style="font-size:1.05rem; font-weight:700; color:#0f172a;">Final Route Sequence</h3>
          <p style="font-size:0.84rem; color:#475569;">
            Computed schedule of stops from the most recent run of the multi-warehouse delivery optimizer.
          </p>
        </div>
        <div id="seq-human-view"></div>
        <pre class="code-viewer" id="seq-raw-view" style="display:none;"></pre>
      </div>
    </div>
  </template>

  <script type="module" src="/structures.js"></script>
</body>
</html>
