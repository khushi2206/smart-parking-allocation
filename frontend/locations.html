<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locations • RouteWise</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app-root"></div>

  <template id="page-content">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title-box">
          <span class="panel-title">Location Management</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="text" id="loc-search-input" class="form-input" placeholder="Search locations..." style="width:220px; padding:6px 10px; font-size:0.82rem;">
          <button class="btn btn-primary btn-sm" id="btn-open-add-loc">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>+ Add Location</span>
          </button>
        </div>
      </div>

      <div class="panel-body" style="padding:0;">
        <div class="table-container" style="border:none; border-radius:0;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Node / Location Name</th>
                <th>Description</th>
                <th>Supply Hub Info</th>
                <th>Connected Roads</th>
                <th>Pending Orders</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="locations-table-body">
              <tr><td colspan="6" style="text-align:center; padding:32px; color:#94a3b8;">Loading locations...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel-footer">
        <span id="loc-count-label" style="color:#64748b;">0 locations in network</span>
        <span style="font-size:0.75rem; color:#64748b;">Locations represent topological vertices V in the weighted graph G = (V, E).</span>
      </div>
    </div>

    <!-- Add/Edit Location Modal -->
    <div class="modal-backdrop" id="loc-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="loc-modal-title">Add New Location Node</h3>
          <button class="btn-icon" id="loc-modal-close" aria-label="Close modal">✕</button>
        </div>
        <form id="loc-form">
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label" for="loc-name-input">Location Name * <span class="optional">(Unique Node Identifier)</span></label>
              <input type="text" id="loc-name-input" class="form-input" placeholder="e.g. City Airport, Tech Park" required>
              <span class="form-help">Unique name of the node in the delivery graph.</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="loc-desc-input">Description <span class="optional">(Optional)</span></label>
              <textarea id="loc-desc-input" class="form-textarea" rows="3" placeholder="e.g. Regional cargo depot and commercial delivery stop"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="loc-modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary" id="loc-modal-submit">Save Location</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script type="module" src="/locations.js"></script>
</body>
</html>
