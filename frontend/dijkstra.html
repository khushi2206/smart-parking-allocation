<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dijkstra Shortest Path • RouteWise</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app-root"></div>

  <template id="page-content">
    <!-- Configuration Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title-box">
          <span class="panel-title">Dijkstra Shortest Path Solver</span>
        </div>
      </div>
      <div class="panel-body">
        <form id="dijkstra-form" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)) 140px; gap:16px; align-items:flex-end;">
          <div class="form-group">
            <label class="form-label" for="dijkstra-start-select">Origin Location (Source) *</label>
            <select id="dijkstra-start-select" class="form-select" required>
              <option value="">-- Select source --</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="dijkstra-dest-select">Destination Location (Target) *</label>
            <select id="dijkstra-dest-select" class="form-select" required>
              <option value="">-- Select destination --</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="dijkstra-objective-select">Optimization Metric *</label>
            <select id="dijkstra-objective-select" class="form-select" required>
              <option value="distance" selected>Minimum Distance (km)</option>
              <option value="time">Minimum Travel Time (min)</option>
              <option value="cost">Minimum Cost (₹ Rupees)</option>
            </select>
          </div>

          <div>
            <button type="submit" class="btn btn-primary" id="btn-run-dijkstra" style="width:100%; height:40px;">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span>Find Path</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Results Section (Visible after execution) -->
    <div id="dijkstra-results-container" style="display:none; display:flex; flex-direction:column; gap:20px;">
      <!-- Summary Badges -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-header">Total Distance</div>
          <div class="stat-value" id="res-distance" style="color:#2563eb;">0 km</div>
          <div class="stat-desc">Cumulative road km</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Total Travel Time</div>
          <div class="stat-value" id="res-time" style="color:#d97706;">0m</div>
          <div class="stat-desc">Road transit duration</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Total Monetary Cost</div>
          <div class="stat-value" id="res-cost" style="color:#16a34a;">₹0</div>
          <div class="stat-desc">Fuel and toll expenses</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Explored Vertices</div>
          <div class="stat-value" id="res-explored" style="color:#0f172a;">0</div>
          <div class="stat-desc">Dequeued nodes</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Heap Operations</div>
          <div class="stat-value" id="res-heap-ops" style="color:#6366f1;">0</div>
          <div class="stat-desc">Min-Heap push/pop/relax</div>
        </div>
      </div>

      <!-- Path Breadcrumb Card -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Reconstructed Optimal Path</span>
          <span class="badge badge-normal" id="res-objective-badge">Distance</span>
        </div>
        <div class="panel-body">
          <div id="res-path-breadcrumbs" style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;"></div>
        </div>
      </div>

      <!-- SVG Graph Visualization of Shortest Path -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Path Visualization on Weighted Network</span>
        </div>
        <div class="panel-body" style="padding:0;">
          <div class="graph-container" id="dijkstra-graph-container" style="height:440px; border:none; border-radius:0;"></div>
        </div>
      </div>

      <!-- Step-by-Step Algorithm Inspector / Debugger -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title-box">
            <span class="panel-title">Interactive Algorithm Execution Trace</span>
          </div>
          <div class="player-controls">
            <div class="player-buttons">
              <button class="btn btn-secondary btn-sm" id="btn-trace-first" title="First step">⏮️</button>
              <button class="btn btn-secondary btn-sm" id="btn-trace-prev" title="Previous step">◀️ Previous</button>
              <button class="btn btn-primary btn-sm" id="btn-trace-play" title="Auto play">▶ Play</button>
              <button class="btn btn-secondary btn-sm" id="btn-trace-next" title="Next step">Next ▶️</button>
              <button class="btn btn-secondary btn-sm" id="btn-trace-last" title="Last step">⏭️</button>
            </div>
            <div class="step-counter" id="trace-step-indicator">Step 0 of 0</div>
          </div>
        </div>
        <div class="panel-body">
          <div id="step-explanation-box" style="padding:14px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; margin-bottom:16px; font-weight:600; color:#1e40af; font-size:0.88rem;">
            Ready to inspect steps.
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <!-- Priority Queue Heap Snapshot -->
            <div>
              <div style="font-weight:700; font-size:0.85rem; color:#0f172a; margin-bottom:6px;">Current Priority Queue (Heap):</div>
              <div id="step-heap-container" style="display:flex; flex-wrap:wrap; gap:6px; min-height:40px; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px;"></div>
            </div>

            <!-- Visited Nodes Snapshot -->
            <div>
              <div style="font-weight:700; font-size:0.85rem; color:#0f172a; margin-bottom:6px;">Visited Set S at Step:</div>
              <div id="step-visited-container" style="display:flex; flex-wrap:wrap; gap:6px; min-height:40px; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="/dijkstra.js"></script>
</body>
</html>
