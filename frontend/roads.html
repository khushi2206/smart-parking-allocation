<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Network • RouteWise</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app-root"></div>

  <template id="page-content">
    <!-- Interactive Graph Visualization Card -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title-box">
          <span class="panel-title">Interactive Weighted Road Network</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="btn btn-primary btn-sm" id="btn-open-add-road">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>+ Add Road</span>
          </button>
        </div>
      </div>

      <div class="panel-body" style="padding:0;">
        <div class="graph-container" id="roads-graph-container" style="height:520px; border:none; border-radius:0;"></div>
      </div>

      <!-- Inspection Details Box -->
      <div class="panel-footer" id="graph-inspection-bar" style="background:#f8fafc; font-size:0.85rem; min-height:48px;">
        <div id="inspection-content" style="color:#64748b;">
          💡 <em>Click any node or road edge above to inspect its graph connectivity and weights. You can also drag nodes to position them.</em>
        </div>
      </div>
    </div>

    <!-- Roads Table -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title-box">
          <span class="panel-title">Configured Road Connections (Weighted Edges E)</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="text" id="roads-search-input" class="form-input" placeholder="Search roads..." style="width:200px; padding:6px 10px; font-size:0.82rem;">
        </div>
      </div>

      <div class="panel-body" style="padding:0;">
        <div class="table-container" style="border:none; border-radius:0;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Origin (From)</th>
                <th>Destination (To)</th>
                <th>Type</th>
                <th>Distance (km)</th>
                <th>Travel Time</th>
                <th>Cost (₹)</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="roads-table-body">
              <tr><td colspan="7" style="text-align:center; padding:32px; color:#94a3b8;">Loading roads...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel-footer">
        <span id="roads-count-label" style="color:#64748b;">0 roads configured</span>
        <span style="font-size:0.75rem; color:#64748b;">Bidirectional roads allow traversal in both directions; one-way roads restrict flow strictly from start to destination.</span>
      </div>
    </div>

    <!-- Add/Edit Road Modal -->
    <div class="modal-backdrop" id="road-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="road-modal-title">Add Weighted Road</h3>
          <button class="btn-icon" id="road-modal-close" aria-label="Close modal">✕</button>
        </div>
        <form id="road-form">
          <div class="modal-body">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="road-start-select">Starting Location *</label>
                <select id="road-start-select" class="form-select" required>
                  <option value="">-- From --</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="road-dest-select">Ending Location *</label>
                <select id="road-dest-select" class="form-select" required>
                  <option value="">-- To --</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="road-distance-input">Distance (Kilometres) *</label>
              <input type="number" id="road-distance-input" class="form-input" min="0.1" step="0.1" placeholder="e.g. 12.5" required>
            </div>

            <div class="form-label" style="margin-bottom:6px;">Travel Time *</div>
            <div class="form-row" style="margin-bottom:16px;">
              <div class="form-group">
                <label class="form-label" for="road-hours-input" style="font-size:0.75rem; color:#64748b;">Hours</label>
                <input type="number" id="road-hours-input" class="form-input" min="0" step="1" value="0">
              </div>
              <div class="form-group">
                <label class="form-label" for="road-minutes-input" style="font-size:0.75rem; color:#64748b;">Minutes</label>
                <input type="number" id="road-minutes-input" class="form-input" min="0" max="59" step="1" value="20" required>
              </div>
            </div>
            <div style="font-size:0.75rem; color:#2563eb; margin-top:-10px; margin-bottom:16px;" id="total-min-preview">Total: 20 minutes</div>

            <div class="form-group">
              <label class="form-label" for="road-cost-input">Fuel / Toll Cost (₹ Rupees) *</label>
              <input type="number" id="road-cost-input" class="form-input" min="0" step="1" placeholder="e.g. 150" required>
            </div>

            <div class="form-group" style="margin-top:10px;">
              <label class="form-label">Road Direction *</label>
              <div style="display:flex; gap:20px; margin-top:4px;">
                <label class="form-check">
                  <input type="radio" name="roadDirection" id="road-dir-bi" value="true" checked>
                  <span>Bidirectional (Two-way ⇄)</span>
                </label>
                <label class="form-check">
                  <input type="radio" name="roadDirection" id="road-dir-one" value="false">
                  <span>One-way (Directed ➔)</span>
                </label>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="road-modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary" id="road-modal-submit">Save Road</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script type="module" src="/roads.js"></script>
</body>
</html>
