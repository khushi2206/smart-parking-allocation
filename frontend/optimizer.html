<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Optimization • RouteWise</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app-root"></div>

  <template id="page-content">
    <!-- Optimizer Form Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title-box">
          <span class="panel-title">Multi-Warehouse Delivery Route Optimizer</span>
        </div>
      </div>
      <div class="panel-body">
        <form id="optimizer-form">
          <div class="form-row" style="margin-bottom:16px;">
            <div class="form-group">
              <label class="form-label" for="opt-start-wh">Starting Warehouse *</label>
              <select id="opt-start-wh" class="form-select" required>
                <option value="">-- Choose departure warehouse --</option>
              </select>
              <span class="form-help">Vehicle departs from this warehouse's location.</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="opt-objective">Optimization Objective *</label>
              <select id="opt-objective" class="form-select" required>
                <option value="distance" selected>Minimum Distance Traveled (km)</option>
                <option value="time">Minimum Travel Time (min)</option>
                <option value="cost">Minimum Monetary Cost (₹)</option>
              </select>
              <span class="form-help">Vehicle delivery tour is optimized strictly by shortest road distance traveled.</span>
            </div>
          </div>

          <div class="form-row" style="margin-bottom:16px;">
            <div class="form-check">
              <input type="checkbox" id="opt-auto-wh" checked>
              <label for="opt-auto-wh" style="font-weight:600; font-size:0.85rem;">
                Enable Multi-Warehouse Automatic Selection
                <span class="form-help" style="display:block;">Allow optimizer to fulfill orders from the closest eligible warehouse with available capacity.</span>
              </label>
            </div>

            <div class="form-check">
              <input type="checkbox" id="opt-return-wh" checked>
              <label for="opt-return-wh" style="font-weight:600; font-size:0.85rem;">
                Return to Starting Warehouse
                <span class="form-help" style="display:block;">Vehicle returns to starting warehouse upon completing all scheduled deliveries.</span>
              </label>
            </div>
          </div>

          <!-- Orders Selection Checklist -->
          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <label class="form-label" style="margin-bottom:0;">Orders to Include in Delivery Run *</label>
              <div style="display:flex; gap:8px;">
                <button type="button" class="btn btn-secondary btn-sm" id="btn-select-all-orders">Select All</button>
                <button type="button" class="btn btn-secondary btn-sm" id="btn-deselect-all-orders">Deselect All</button>
              </div>
            </div>
            <div id="orders-checklist-container" style="max-height:200px; overflow-y:auto; border:1px solid #e2e8f0; border-radius:6px; padding:10px; background:#ffffff; display:flex; flex-direction:column; gap:6px;">
              <span style="color:#94a3b8; font-size:0.85rem;">Loading orders...</span>
            </div>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
            <button type="submit" class="btn btn-primary" id="btn-execute-optimizer" style="padding:10px 24px; font-size:0.95rem;">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
              </svg>
              <span>Calculate Optimal Delivery Tour</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Optimization Results Container -->
    <div id="optimizer-results-container" style="display:none; display:flex; flex-direction:column; gap:20px;">
      <!-- KPI Metrics Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-header">Total Distance</div>
          <div class="stat-value" id="opt-res-distance" style="color:#2563eb;">0 km</div>
          <div class="stat-desc">Road transit distance</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Total Travel Time</div>
          <div class="stat-value" id="opt-res-travel-time" style="color:#d97706;">0m</div>
          <div class="stat-desc">Driving duration</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Total Service Time</div>
          <div class="stat-value" id="opt-res-service-time" style="color:#6366f1;">0m</div>
          <div class="stat-desc">Unloading at stops</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Total Trip Cost</div>
          <div class="stat-value" id="opt-res-cost" style="color:#16a34a;">₹0</div>
          <div class="stat-desc">Fuel &amp; toll expenses</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Delivered Stops</div>
          <div class="stat-value" id="opt-res-delivered-count" style="color:#0f172a;">0</div>
          <div class="stat-desc">Scheduled orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Deadline Status</div>
          <div class="stat-value" id="opt-res-ontime-count" style="color:#16a34a; font-size:1.4rem;">0 On-Time</div>
          <div class="stat-desc" id="opt-res-late-desc">0 late orders</div>
        </div>
      </div>

      <!-- SVG Route Map -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title-box">
            <span class="panel-title">Planned Tour Visualization</span>
          </div>
          <div style="display:flex; gap:8px;">
            <a href="/trace.html" class="btn btn-secondary btn-sm">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span>Inspect Execution Trace →</span>
            </a>
            <button class="btn btn-success btn-sm" id="btn-mark-all-delivered">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
              <span>Mark Route Delivered</span>
            </button>
          </div>
        </div>
        <div class="panel-body" style="padding:0;">
          <div class="graph-container" id="optimizer-graph-container" style="height:480px; border:none; border-radius:0;"></div>
        </div>
      </div>

      <!-- Detailed Route Legs Table -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title-box">
            <span class="panel-title">Detailed Delivery Stops &amp; Legs Breakdown</span>
          </div>
        </div>
        <div class="panel-body" style="padding:0;">
          <div class="table-container" style="border:none; border-radius:0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Stop #</th>
                  <th>Order ID</th>
                  <th>Destination Location</th>
                  <th>Priority</th>
                  <th>Serving Hub</th>
                  <th>Leg Distance</th>
                  <th>Travel Time</th>
                  <th>Service Time</th>
                  <th>Leg Cost</th>
                  <th>Arrival Time</th>
                  <th>Deadline Status</th>
                  <th>Leg Path</th>
                </tr>
              </thead>
              <tbody id="optimizer-stops-body">
                <tr><td colspan="12" style="text-align:center; padding:24px;">No route calculated yet.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="/optimizer.js"></script>
</body>
</html>
