<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouses • RouteWise</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app-root"></div>

  <template id="page-content">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title-box">
          <span class="panel-title">Warehouse Management</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="text" id="wh-search-input" class="form-input" placeholder="Search warehouses..." style="width:220px; padding:6px 10px; font-size:0.82rem;">
          <button class="btn btn-primary btn-sm" id="btn-open-add-wh">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>+ Add Warehouse</span>
          </button>
        </div>
      </div>

      <div class="panel-body" style="padding:0;">
        <div class="table-container" style="border:none; border-radius:0;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Warehouse ID</th>
                <th>Warehouse Name</th>
                <th>Location Node</th>
                <th>Capacity (kg)</th>
                <th>Role / Status</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="warehouses-table-body">
              <tr><td colspan="6" style="text-align:center; padding:32px; color:#94a3b8;">Loading warehouses...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel-footer">
        <span id="wh-count-label" style="color:#64748b;">0 warehouses registered</span>
        <span style="font-size:0.75rem; color:#64748b;">Note: Setting a default warehouse sets the primary departure point for delivery routes.</span>
      </div>
    </div>

    <!-- Add/Edit Warehouse Modal -->
    <div class="modal-backdrop" id="wh-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="wh-modal-title">Add New Warehouse</h3>
          <button class="btn-icon" id="wh-modal-close" aria-label="Close modal">✕</button>
        </div>
        <form id="wh-form">
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label" for="wh-id-input">Warehouse ID <span class="optional">(Unique, e.g. WH-01)</span></label>
              <input type="text" id="wh-id-input" class="form-input" placeholder="Auto-generated if left blank">
              <span class="form-help">Unique identifier for this warehouse.</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="wh-name-input">Warehouse Name *</label>
              <input type="text" id="wh-name-input" class="form-input" placeholder="e.g. Central Distribution Depot" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="wh-location-select">Location Node *</label>
              <select id="wh-location-select" class="form-select" required>
                <option value="">-- Select location node --</option>
              </select>
              <span class="form-help">Must match an existing location in your road network.</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="wh-capacity-input">Storage / Vehicle Capacity (kg) *</label>
              <input type="number" id="wh-capacity-input" class="form-input" placeholder="e.g. 500" min="1" step="1" required>
            </div>

            <div class="form-check" style="margin-top:12px;">
              <input type="checkbox" id="wh-default-checkbox">
              <label for="wh-default-checkbox" style="font-weight:600; font-size:0.85rem;">Set as default starting warehouse</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="wh-modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary" id="wh-modal-submit">Save Warehouse</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script type="module" src="/warehouses.js"></script>
</body>
</html>
