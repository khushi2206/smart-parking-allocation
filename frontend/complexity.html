<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complexity Analysis • RouteWise</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app-root"></div>

  <template id="page-content">
    <!-- Live Graph Sizing Metrics Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title-box">
          <span class="panel-title">Real-time Graph &amp; Problem Instance Sizing</span>
        </div>
      </div>
      <div class="panel-body">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-header">Locations |V|</div>
            <div class="stat-value" id="cx-v-count" style="color:#2563eb;">0</div>
            <div class="stat-desc">Vertices in Graph G</div>
          </div>
          <div class="stat-card">
            <div class="stat-header">Road Connections |E|</div>
            <div class="stat-value" id="cx-e-count" style="color:#475569;">0</div>
            <div class="stat-desc">Directed Adjacency Entries</div>
          </div>
          <div class="stat-card">
            <div class="stat-header">Warehouses |W|</div>
            <div class="stat-value" id="cx-w-count" style="color:#16a34a;">0</div>
            <div class="stat-desc">Supply Origin Hubs</div>
          </div>
          <div class="stat-card">
            <div class="stat-header">Delivery Orders |K|</div>
            <div class="stat-value" id="cx-k-count" style="color:#d97706;">0</div>
            <div class="stat-desc">Pending Scheduled Stops</div>
          </div>
          <div class="stat-card">
            <div class="stat-header">Dijkstra Operation Bound</div>
            <div class="stat-value" id="cx-dijkstra-bound" style="font-size:1.4rem; color:#6366f1;">O(0)</div>
            <div class="stat-desc">(V + E) log V ops</div>
          </div>
          <div class="stat-card">
            <div class="stat-header">Optimizer Bound</div>
            <div class="stat-value" id="cx-opt-bound" style="font-size:1.4rem; color:#0f172a;">O(0)</div>
            <div class="stat-desc">K² (V + E) log V ops</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Algorithm Deep Dive Cards -->
    <div style="display:flex; flex-direction:column; gap:20px;">
      <!-- Dijkstra & Binary Heap -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">1. Dijkstra's Algorithm with Binary Min-Heap</span>
          <span class="badge badge-normal">Time: O((V + E) log V) • Space: O(V + E)</span>
        </div>
        <div class="panel-body" style="font-size:0.88rem; color:#334155; line-height:1.65;">
          <p>
            Dijkstra's algorithm finds the shortest path from a starting location to all reachable locations in a directed or undirected graph with <strong>strictly nonnegative edge weights</strong> (distance in km, transit time in min, or cost in ₹).
          </p>

          <h4 style="margin-top:14px; margin-bottom:6px; color:#0f172a; font-weight:700;">Mathematical Complexity Derivation:</h4>
          <ol style="margin-left:22px;">
            <li><strong>Initialization:</strong> Distance to start is set to <code>0</code>, and all other <code>|V| - 1</code> vertices are set to <code>&infin;</code>. Enqueue start node: <code>O(1)</code>.</li>
            <li><strong>Vertex Extraction (extractMin):</strong> Each of the <code>|V|</code> vertices is dequeued at most once from the binary min-heap. Each extract-min operation requires bubble-down in <code>O(log V)</code> time. Total vertex extraction time = <code>O(V log V)</code>.</li>
            <li><strong>Edge Relaxation:</strong> For every directed edge <code>(u, v) &in; E</code>, we inspect whether <code>dist[u] + weight(u, v) &lt; dist[v]</code>. If an improvement is found, we update <code>dist[v]</code> and insert the updated distance into the heap in <code>O(log V)</code> time. Over the entire search, at most <code>|E|</code> relaxations occur. Total edge relaxation time = <code>O(E log V)</code>.</li>
            <li><strong>Total Dijkstra Time Complexity:</strong> Combining both phases yields <code>O((V + E) log V)</code>.</li>
          </ol>

          <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:6px; padding:12px; margin-top:14px; font-size:0.82rem; color:#1e40af;">
            <strong>Convention Note:</strong> Here, <code>V</code> represents the total number of distinct location nodes, and <code>E</code> represents the total number of directed edges in the adjacency list. For bidirectional roads, each road contributes two directed edges (one in each direction).
          </div>
        </div>
      </div>

      <!-- Multi-Warehouse Prim's Algorithm Optimizer Complexity -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">2. Prim's Algorithm &amp; Multi-Warehouse Delivery Optimizer</span>
          <span class="badge badge-normal">Time: O(K² · (V + E) log V) • Space: O(V + E + K)</span>
        </div>
        <div class="panel-body" style="font-size:0.88rem; color:#334155; line-height:1.65;">
          <p>
            The multi-warehouse route optimizer constructs the delivery tour using <strong>Prim's Algorithm (Minimum Spanning Tree / Greedy Cut Property)</strong> to iteratively connect delivery locations into a delivery tree originating from warehouse distribution hubs.
          </p>

          <h4 style="margin-top:14px; margin-bottom:6px; color:#0f172a; font-weight:700;">How Prim's Algorithm is Applied:</h4>
          <p>
            Standard Prim's algorithm grows a tree \(T\) from an initial root vertex by maintaining a cut \((S, V \setminus S)\) between visited vertices \(S\) and unvisited vertices \(V \setminus S\). At each iteration, it greedily selects the minimum-cost edge crossing the cut. In RouteWise:
          </p>
          <ol style="margin-left:22px;">
            <li><strong>Initialization:</strong> The distribution hub is added to the MST visited vertex set \(S = \{\text{warehouse}\}\).</li>
            <li><strong>Cut Evaluation:</strong> For every unvisited destination in \(V \setminus S\), the shortest path and transit metrics from the current frontier are evaluated using Dijkstra: <code>O((V + E) log V)</code>.</li>
            <li><strong>Priority-Aware Greedy Choice:</strong> Candidate crossing edges are organized in a Min-Heap keyed by priority rank (Critical &gt; High &gt; Normal &gt; Low), remaining delivery deadlines, vehicle capacity constraints, and objective scores.</li>
            <li><strong>Tree Expansion:</strong> The highest-priority, minimum-cost candidate \(u^* \in V \setminus S\) is extracted and added to \(S \leftarrow S \cup \{u^*\}\). The process repeats until all deliveries are fulfilled, followed by an optional return leg to the starting hub.</li>
          </ol>
        </div>
      </div>

      <!-- Data Structures Comparison Table -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">3. Data Structures Performance Matrix</span>
        </div>
        <div class="panel-body" style="padding:0;">
          <div class="table-container" style="border:none; border-radius:0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Data Structure</th>
                  <th>Primary Use Case in RouteWise</th>
                  <th>Space Complexity</th>
                  <th>Insertion</th>
                  <th>Lookup / Extract</th>
                  <th>Key Advantage</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>Adjacency List (Map)</strong></td>
                  <td>Graph road network representation</td>
                  <td><code>O(V + E)</code></td>
                  <td><code>O(1)</code></td>
                  <td><code>O(deg(u))</code></td>
                  <td>Optimal for sparse transportation graphs; no wasted <code>V²</code> matrix space.</td>
                </tr>
                <tr>
                  <td><strong>Binary Min-Heap</strong></td>
                  <td>Priority queue in Dijkstra &amp; candidates</td>
                  <td><code>O(V)</code></td>
                  <td><code>O(log V)</code></td>
                  <td><code>O(log V)</code></td>
                  <td>Guarantees logarithmic extraction of lowest-weight candidate.</td>
                </tr>
                <tr>
                  <td><strong>Distance Table (Map)</strong></td>
                  <td>Shortest path upper bounds</td>
                  <td><code>O(V)</code></td>
                  <td><code>O(1)</code></td>
                  <td><code>O(1)</code></td>
                  <td>Constant-time distance verification and in-place relaxation.</td>
                </tr>
                <tr>
                  <td><strong>Predecessor Map</strong></td>
                  <td>Path reconstruction backtracking</td>
                  <td><code>O(V)</code></td>
                  <td><code>O(1)</code></td>
                  <td><code>O(1)</code></td>
                  <td>Enables linear <code>O(V)</code> path reconstruction from target to source.</td>
                </tr>
                <tr>
                  <td><strong>Visited Set</strong></td>
                  <td>Explored vertices tracking</td>
                  <td><code>O(V)</code></td>
                  <td><code>O(1)</code></td>
                  <td><code>O(1)</code></td>
                  <td>Prevents re-processing nodes; guarantees loop-free search.</td>
                </tr>
                <tr>
                  <td><strong>MST Cut Set (Set)</strong></td>
                  <td>Prim's tree expansion tracking (S vs V \ S)</td>
                  <td><code>O(V)</code></td>
                  <td><code>O(1)</code></td>
                  <td><code>O(1)</code></td>
                  <td>Maintains the growing spanning tree vertices to ensure cycle-free greedy tour expansion.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="/complexity.js"></script>
</body>
</html>
